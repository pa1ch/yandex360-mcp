name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Точная версия, а не плавающий мажор: setup-uv с v8 их не публикует.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PY_VER=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$TAG  pyproject=$PY_VER"
          test "$TAG" = "$PY_VER"

      - name: Run tests
        run: uv run pytest -q

      - name: Build
        run: uv build

      # Ставим собранное колесо в чистое окружение и запускаем — так же, как это
      # сделает uvx у пользователя. Ловит поломки, которых не видно из uv run:
      # зависимость, разрешённую в несовместимую версию (см. mcp 2.0), и всё, что
      # падает на импорте. MCP-клиенты такое не показывают — сервер просто исчезает.
      - name: Smoke-test the built wheel in a clean environment
        env:
          WIKI_TOKEN: dummy-token
          WIKI_ORG_ID: "42"
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import importlib.metadata as m; print('resolved mcp =', m.version('mcp'))"
          OUT=$(/tmp/smoke/bin/yandex360-mcp </dev/null 2>&1)
          echo "$OUT"
          grep -q "активные модули: wiki" <<<"$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  mcpb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Set manifest version from tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

      - name: Validate and pack .mcpb
        run: |
          set -euo pipefail
          mcpb validate manifest.json
          mcpb pack . "yandex360-mcp-${GITHUB_REF_NAME}.mcpb"

      - uses: actions/upload-artifact@v7
        with:
          name: mcpb
          path: "*.mcpb"

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Requires a PyPI Trusted Publisher configured for this repo + environment.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing / OIDC — no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  github-release:
    needs: [pypi, mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: mcpb
          path: mcpb/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* mcpb/*.mcpb --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](CHANGELOG.md)."

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # for `mcp-publisher login github-oidc`
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set version in server.json from tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" \
            '.version = $v | (.packages[] | select(.registryType == "pypi") | .version) = $v' \
            server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Validate manifest
        run: ./mcp-publisher validate server.json

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
