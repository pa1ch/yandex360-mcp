[project]
name = "yandex360-mcp"
version = "0.1.3"
description = "MCP-сервер для сервисов Яндекс 360 (Вики и далее) — инструменты для AI-ассистентов."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pavel Chugaev", email = "chugaevpaul@gmail.com" }]
keywords = ["mcp", "yandex", "yandex360", "wiki", "llm", "ai", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
yandex360-mcp = "yandex360_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/pa1ch/yandex360-mcp"
Repository = "https://github.com/pa1ch/yandex360-mcp"
Issues = "https://github.com/pa1ch/yandex360-mcp/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yandex360_mcp"]
